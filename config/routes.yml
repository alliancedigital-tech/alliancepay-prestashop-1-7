alliance.admin.configure:
  path: /admin/alliancepay/configure
  methods: [ GET, POST ]
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Settings\AlliancePaySettingsController::indexAction'
    _legacy_controller: 'AlliancePaySettingsController'
    _legacy_link: 'AlliancePaySettingsController'

alliance.save.config:
  path: /alliancepay/admin/save/config
  methods: [ POST ]
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Settings\AlliancePaySaveSettingsController::saveAction'
    _legacy_controller: 'AlliancePaySaveSettingsController'
    _legacy_link: 'AlliancePaySaveSettingsController'

alliance.order.sync:
  path: /alliancepay/admin/order/{orderId}/sync
  methods: [ GET ]
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Order\TransactionInfoController::syncAction'

# Subscriptions: plan templates
alliance.admin.subscription.templates:
  path: /alliancepay/admin/subscription/templates
  methods: [ GET ]
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Subscription\TemplateController::indexAction'
    _legacy_controller: 'AlliancePayTemplates'
    _legacy_link: 'AlliancePayTemplates'

alliance.admin.subscription.template_new:
  path: /alliancepay/admin/subscription/templates/new
  methods: [ GET, POST ]
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Subscription\TemplateController::formAction'
    _legacy_controller: 'AlliancePayTemplates'

alliance.admin.subscription.template_edit:
  path: /alliancepay/admin/subscription/templates/{id}/edit
  methods: [ GET, POST ]
  requirements:
    id: '\d+'
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Subscription\TemplateController::formAction'
    _legacy_controller: 'AlliancePayTemplates'

alliance.admin.subscription.template_archive:
  path: /alliancepay/admin/subscription/templates/{id}/archive
  methods: [ POST ]
  requirements:
    id: '\d+'
  defaults:
    _controller: 'AlliancePay\Controller\Admin\Subscription\TemplateController::archiveAction'
    _legacy_controller: 'AlliancePayTemplates'

